<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico Spotify Bridge</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 400px);
      padding: 25px;
      text-align: center;
      background: #1e1e1e;
      border-radius: 20px;
    }

    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 5px 0;
    }

    h2 {
      margin: 5px 0 20px;
      color: #aaa;
      font-weight: normal;
    }

    .progress {
      width: 100%;
      margin-top: 20px;
    }

    .status {
      margin-top: 15px;
      color: #1ed760;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #1ed760;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #error {
      margin-top: 15px;
      color: #ff5555;
    }
  </style>
</head>

<body>

<div class="card">

  <img id="artwork" src="https://via.placeholder.com/250">

  <h1 id="title">Nome da música</h1>

  <h2 id="artist">Nome do artista</h2>

  <div id="album">Nome do álbum</div>

  <input
    id="progress"
    class="progress"
    type="range"
    min="0"
    value="0"
    disabled
  >

  <div id="time">0:00 / 0:00</div>

  <div id="status" class="status">
    ⏸️ Pausado
  </div>

  <button id="loginButton">
    🎵 Conectar ao Spotify
  </button>

  <div id="error"></div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const CLIENT_ID = "7e599605af6f426296acac0b92408a6f";

const REDIRECT_URI =
  "https://juliagherardic-coder.github.io/pico-spotify-bridge/";


/*
   ENDPOINT DA PICO 2 W
*/

const BRIDGE_URL =
  "https://pico-spotify-bridge.juliagherardic.workers.dev/now-playing.json";


/* =========================================================
   ELEMENTOS
   ========================================================= */

const artwork =
  document.getElementById("artwork");

const titleElement =
  document.getElementById("title");

const artistElement =
  document.getElementById("artist");

const albumElement =
  document.getElementById("album");

const progress =
  document.getElementById("progress");

const timeElement =
  document.getElementById("time");

const statusElement =
  document.getElementById("status");

const loginButton =
  document.getElementById("loginButton");

const errorElement =
  document.getElementById("error");


/* =========================================================
   PKCE
   ========================================================= */

function generateRandomString(length) {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += characters.charAt(
      Math.floor(
        Math.random() * characters.length
      )
    );

  }

  return result;
}


async function sha256(plain) {

  const encoder =
    new TextEncoder();

  const data =
    encoder.encode(plain);

  return await window.crypto.subtle.digest(
    "SHA-256",
    data
  );
}


function base64UrlEncode(arrayBuffer) {

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(arrayBuffer)
    )
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


async function createCodeChallenge(verifier) {

  const hashed =
    await sha256(verifier);

  return base64UrlEncode(hashed);

}


/* =========================================================
   LOGIN SPOTIFY
   ========================================================= */

async function loginSpotify() {

  const verifier =
    generateRandomString(128);

  const challenge =
    await createCodeChallenge(verifier);

  localStorage.setItem(
    "spotify_code_verifier",
    verifier
  );

  const params =
    new URLSearchParams({

      client_id: CLIENT_ID,

      response_type: "code",

      redirect_uri: REDIRECT_URI,

      code_challenge_method: "S256",

      code_challenge: challenge,

      scope:
        "user-read-currently-playing user-read-playback-state"

    });


  window.location.href =
    "https://accounts.spotify.com/authorize?" +
    params.toString();

}


/* =========================================================
   TOKEN
   ========================================================= */

async function getAccessToken(code) {

  const verifier =
    localStorage.getItem(
      "spotify_code_verifier"
    );

  if (!verifier) {

    throw new Error(
      "Código PKCE não encontrado."
    );

  }


  const body =
    new URLSearchParams({

      client_id: CLIENT_ID,

      grant_type:
        "authorization_code",

      code: code,

      redirect_uri:
        REDIRECT_URI,

      code_verifier:
        verifier

    });


  const response =
    await fetch(
      "https://accounts.spotify.com/api/token",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body: body
      }
    );


  if (!response.ok) {

    throw new Error(
      "Não foi possível obter o token."
    );

  }


  const data =
    await response.json();


  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );


  if (data.refresh_token) {

    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );

  }


  return data.access_token;

}


/* =========================================================
   ENVIAR DADOS PARA A PICO
   ========================================================= */

async function sendToBridge(data) {

  try {

    await fetch(
      BRIDGE_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify(data)
      }
    );

  } catch (error) {

    console.error(
      "Erro enviando dados para a Pico:",
      error
    );

  }

}


/* =========================================================
   MÚSICA ATUAL
   ========================================================= */

async function getCurrentlyPlaying() {

  const token =
    localStorage.getItem(
      "spotify_access_token"
    );


  if (!token) {
    return;
  }


  const response =
    await fetch(
      "https://api.spotify.com/v1/me/player",
      {
        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );


  if (response.status === 204) {

    const emptyData = {

      title: "",

      artist: "",

      album: "",

      artworkUrl: "",

      positionMs: 0,

      durationMs: 0,

      isPlaying: false

    };


    statusElement.textContent =
      "⏸️ Nenhuma música tocando";


    await sendToBridge(
      emptyData
    );


    return;

  }


  if (response.status === 401) {

    localStorage.removeItem(
      "spotify_access_token"
    );

    loginButton.style.display =
      "block";

    statusElement.textContent =
      "🔐 Faça login novamente";

    return;

  }


  if (!response.ok) {

    throw new Error(
      "Erro ao consultar o Spotify."
    );

  }


  const data =
    await response.json();


  if (!data || !data.item) {

    return;

  }


  const track =
    data.item;


  const title =
    track.name || "";


  const artist =
    track.artists
      .map(
        a => a.name
      )
      .join(", ");


  const album =
    track.album
      ? track.album.name
      : "";


  const artworkUrl =
    track.album &&
    track.album.images &&
    track.album.images.length > 0
      ? track.album.images[0].url
      : "";


  const durationMs =
    track.duration_ms || 0;


  const positionMs =
    data.progress_ms || 0;


  const isPlaying =
    data.is_playing === true;


  /* =====================================================
     MOSTRAR NA PÁGINA
     ===================================================== */

  titleElement.textContent =
    title;


  artistElement.textContent =
    artist;


  albumElement.textContent =
    album;


  if (artworkUrl) {

    artwork.src =
      artworkUrl;

  }


  progress.max =
    durationMs;


  progress.value =
    positionMs;


  timeElement.textContent =
    `${formatTime(positionMs)} / ${formatTime(durationMs)}`;


  statusElement.textContent =
    isPlaying
      ? "▶️ Tocando"
      : "⏸️ Pausado";


  /* =====================================================
     ATUALIZAR URL DO SITE
     ===================================================== */

  const urlParams =
    new URLSearchParams();


  urlParams.set(
    "title",
    title
  );


  urlParams.set(
    "artist",
    artist
  );


  urlParams.set(
    "album",
    album
  );


  urlParams.set(
    "durationMs",
    durationMs
  );


  urlParams.set(
    "positionMs",
    positionMs
  );


  urlParams.set(
    "isPlaying",
    isPlaying
  );


  if (artworkUrl) {

    urlParams.set(
      "artworkUrl",
      artworkUrl
    );

  }


  const newUrl =
    window.location.pathname +
    "?" +
    urlParams.toString();


  window.history.replaceState(
    {},
    "",
    newUrl
  );


  /* =====================================================
     ENVIAR PARA O CLOUDFLARE
     ===================================================== */

  await sendToBridge({

    title:
      title,

    artist:
      artist,

    album:
      album,

    artworkUrl:
      artworkUrl,

    positionMs:
      positionMs,

    durationMs:
      durationMs,

    isPlaying:
      isPlaying

  });

}


/* =========================================================
   FORMATO DO TEMPO
   ========================================================= */

function formatTime(ms) {

  const seconds =
    Math.floor(ms / 1000);


  const minutes =
    Math.floor(seconds / 60);


  const remainingSeconds =
    seconds % 60;


  return `${minutes}:${remainingSeconds
    .toString()
    .padStart(2, "0")}`;

}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function start() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const code =
    params.get("code");


  const error =
    params.get("error");


  if (error) {

    errorElement.textContent =
      "Login cancelado ou recusado.";

    return;

  }


  if (code) {

    try {

      loginButton.style.display =
        "none";

      statusElement.textContent =
        "🔄 Conectando ao Spotify...";


      await getAccessToken(
        code
      );


      window.history.replaceState(
        {},
        "",
        window.location.pathname
      );


    } catch (error) {

      console.error(error);

      errorElement.textContent =
        error.message;

      return;

    }

  }


  const token =
    localStorage.getItem(
      "spotify_access_token"
    );


  if (token) {

    loginButton.style.display =
      "none";


    try {

      await getCurrentlyPlaying();

    } catch (error) {

      console.error(error);

      errorElement.textContent =
        error.message;

    }

  }

}


/* =========================================================
   BOTÃO
   ========================================================= */

loginButton.addEventListener(
  "click",
  loginSpotify
);


/* =========================================================
   COMEÇAR
   ========================================================= */

start();


/* =========================================================
   ATUALIZAR A CADA 5 SEGUNDOS
   ========================================================= */

setInterval(
  async () => {

    const token =
      localStorage.getItem(
        "spotify_access_token"
      );


    if (!token) {
      return;
    }


    try {

      await getCurrentlyPlaying();

    } catch (error) {

      console.error(error);

    }

  },
  5000
);

</script>

</body>
</html>
